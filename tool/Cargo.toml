[package]
name = "zolly"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "blocking", "multipart"] }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "5.0"
git2 = "0.18"
regex = "1.10"
chrono = { version = "0.4", features = ["serde"] }
dotenv = "0.15.0"
parking_lot = "0.12"

[dev-dependencies]
# `test-util` adds `#[tokio::test(start_paused = true)]`, which lets the retry
# tests step through the real backoff sleeps without waiting on them.
tokio = { version = "1.40", features = ["full", "test-util"] }

[[bin]]
name = "zolly"
path = "src/main.rs"
